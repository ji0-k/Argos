version: '3.8'

services:
  postgresql:
    image: postgres:15
    container_name: argos_postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tunnel_detection}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - argos_network

  fastapi:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: argos_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./ai_server/models:/app/models
    env_file:
      - .env
    networks:
      - argos_network
    restart: unless-stopped

  flask:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argos_flask
    depends_on:
      postgresql:
        condition: service_healthy
      fastapi:
        condition: service_started
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./captures:/app/captures
    networks:
      - argos_network
    restart: unless-stopped

  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argos_react
    depends_on:
      - flask
    ports:
      - "3000:3000"
    networks:
      - argos_network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  argos_network:
    driver: bridge
