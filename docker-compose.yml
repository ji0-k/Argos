version: '3.8'

services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: ./ai_server
    ports:
      - "8000:8000"
    volumes:
      - ./ai_server/models:/app/models
    env_file:
      - .env
    restart: unless-stopped

  flask:
    build: ./backend
    depends_on:
      postgresql:
        condition: service_healthy
      fastapi:
        condition: service_started
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./captures:/app/captures
    restart: unless-stopped

  react:
    build: ./frontend
    depends_on:
      - flask
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
